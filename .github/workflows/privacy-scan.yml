name: Privacy scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Scan personal data and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run scanner tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan changed commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/privacy_scan.py --all-files
          else
            python3 scripts/privacy_scan.py --range "$BASE_SHA..$HEAD_SHA"
          fi

      - name: Scan credentials with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
